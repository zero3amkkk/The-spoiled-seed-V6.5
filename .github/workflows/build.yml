
name: Build TheSpoiledSeed JAR

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Install Gradle 2.14.1
        run: |
          wget -q https://services.gradle.org/distributions/gradle-2.14.1-bin.zip
          unzip -q gradle-2.14.1-bin.zip
          echo "$PWD/gradle-2.14.1/bin" >> "$GITHUB_PATH"

      - name: Extract source ZIP
        run: |
          unzip -q TheSpoiledSeed-0.1.1-v6-source.zip
          test -f TheSpoiledSeed/build.gradle

      - name: Build Minecraft Mod
        working-directory: TheSpoiledSeed
        run: gradle setupCIWorkspace build --no-daemon --stacktrace

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: TheSpoiledSeed-JAR
          path: TheSpoiledSeed/build/libs/*.jar
          if-no-files-found: error
